# Security headers for every page and file served by nginx (included in each location block, because
# nginx drops server-level add_header lines in any block that sets its own headers).
# CSP: only our own scripts, styles, images and API. No inline scripts, no other websites, no framing.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Tell browsers to only ever use HTTPS for this site (ignored on plain-http localhost; effective once the
# site is served over HTTPS).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
